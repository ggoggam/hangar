name: Release Android

# Builds the signed app bundle from a v<versionName> tag, with a versionCode it works out, and
# uploads it to Google Play. Tag release makes the tag when a new versionName passes CI on main and
# starts this with the PLAY_TRACK track. A pushed tag goes to the track in the PLAY_TRACK repository
# variable, closed testing ("alpha") if it's unset.
# Running it by hand picks the track, from a tag or from main. From main it builds main as it is,
# with the versionName it has and a new versionCode, for a build that doesn't need a version bump. "none" only builds the bundle, which is how the
# first one gets to Play Console, since Play takes no API uploads before that (see RELEASING.md).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: Play track ("none" only builds the bundle)
        type: choice
        options:
          - alpha
          - internal
          - production
          - none
        default: alpha
      status:
        description: Release status ("draft" until Play takes completed releases)
        type: choice
        options:
          - completed
          - draft
        default: completed

permissions:
  contents: read

# One release at a time, and never cancelled halfway through an upload.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # The upload key and the Play service account are secrets of this environment, so its
    # deployment rules decide which refs can use them.
    environment: play-store
    env:
      # A tag push has no inputs, so it gets PLAY_TRACK or closed testing, and completed.
      TRACK: ${{ inputs.track || vars.PLAY_TRACK || 'alpha' }}
      STATUS: ${{ inputs.status || 'completed' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history, since the commit count is the versionCode.
          fetch-depth: 0

      # Every build on Play is main or a tag that says what module.yaml says.
      - name: Check the version
        id: version
        run: |
          version="$(sed -n 's/^ *versionName: *"\(.*\)"$/\1/p' android-app/module.yaml)"
          case "$GITHUB_REF_TYPE/$GITHUB_REF_NAME" in
            "tag/v$version" | branch/main) ;;
            tag/*)
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in android-app/module.yaml."
              exit 1
              ;;
            *)
              echo "::error::Releases are built from main or a v* tag. Run this from one of those, not $GITHUB_REF_NAME."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restores the CI android job's toolchain cache but never saves one, so a release can't
      # change what CI builds with.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-android-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-android-

      # versionCode is the commit count, or one past the highest code on Play if that's higher, so
      # it climbs on its own and running this again for the same commit doesn't reuse one. Play
      # turns down a code it has seen, on any track, from any bundle uploaded. A build that isn't
      # uploaded ("none") doesn't ask Play, since there may be no service account yet.
      - name: Work out the versionCode
        id: code
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          code="$(git rev-list --count HEAD)"
          if [ "$TRACK" != none ]; then
            [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::The play-store environment has no PLAY_SERVICE_ACCOUNT_JSON secret."; exit 1; }
            # A token for the Play Developer API, from a JWT the service account's key signs.
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            claims="$(jq -c --argjson now "$(date +%s)" '{iss: .client_email, scope: "https://www.googleapis.com/auth/androidpublisher", aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}' <<< "$PLAY_SERVICE_ACCOUNT_JSON")"
            unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$(printf '%s' "$claims" | b64url)"
            signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign <(jq -r .private_key <<< "$PLAY_SERVICE_ACCOUNT_JSON") | b64url)"
            token="$(curl -fsS https://oauth2.googleapis.com/token -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d assertion="$unsigned.$signature" | jq -r .access_token)"
            echo "::add-mask::$token"

            # Reading bundles and tracks takes an edit, which is thrown away after.
            api=https://androidpublisher.googleapis.com/androidpublisher/v3/applications/dev.ggoggam.hangar/edits
            auth="Authorization: Bearer $token"
            edit="$(curl -fsS -X POST -H "$auth" "$api" | jq -r .id)"
            highest="$( {
              curl -fsS -H "$auth" "$api/$edit/bundles" | jq -r '.bundles[]?.versionCode'
              curl -fsS -H "$auth" "$api/$edit/tracks" | jq -r '.tracks[]?.releases[]?.versionCodes[]?'
            } | sort -n | tail -n 1)"
            curl -fsS -X DELETE -H "$auth" "$api/$edit" > /dev/null
            if [ -n "$highest" ] && [ "$highest" -ge "$code" ]; then
              code=$((highest + 1))
            fi
          fi
          # Written in next to versionName, for this build only.
          sed -i "s/^\( *\)versionName: .*/\1versionCode: $code\n&/" android-app/module.yaml
          grep -q "^ *versionCode: $code$" android-app/module.yaml
          echo "::notice::versionCode $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The keystore goes in the runner's temp directory, outside the checkout.
      - name: Write the upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::The play-store environment has no $name secret."; exit 1; }
          done
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_UPLOAD_KEY_ALIAS"
            echo "keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD"
          } > android-app/keystore.properties

      # R8's mapping is inside the bundle (BUNDLE-METADATA), so Play deobfuscates crash reports
      # without a separate mapping upload.
      - name: Build the signed app bundle
        run: |
          ./kotlin package -m android-app -f aab
          cp build/tasks/_android-app_bundleAndroid/gradle-project-release.aab "hangar-${{ steps.version.outputs.version }}-${{ steps.code.outputs.code }}.aab"

      # Without a usable keystore the toolchain only warns and builds an unsigned bundle, which
      # Play would turn down after the upload. Catch it here instead.
      - name: Check the bundle is signed
        run: jarsigner -verify "hangar-${{ steps.version.outputs.version }}-${{ steps.code.outputs.code }}.aab" | grep -q "jar verified"

      - uses: actions/upload-artifact@v7
        with:
          name: hangar-${{ steps.version.outputs.version }}-${{ steps.code.outputs.code }}
          path: hangar-${{ steps.version.outputs.version }}-${{ steps.code.outputs.code }}.aab
          if-no-files-found: error

      # A third-party action with the service account's key, so it's pinned to a commit.
      - name: Upload to Google Play
        if: env.TRACK != 'none'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.ggoggam.hangar
          releaseFiles: hangar-${{ steps.version.outputs.version }}-${{ steps.code.outputs.code }}.aab
          releaseName: ${{ steps.version.outputs.version }} (${{ steps.code.outputs.code }})
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
