name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

# Makes mise also load mise.ci.toml, which pins the JDK ktlint runs on. Without this the file is
# ignored and the runner's default JDK is used.
env:
  MISE_ENV: ci
  # Install and run only what mise.lock and mise.ci.lock pin, in mise-action and `mise run` alike.
  MISE_LOCKED: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners throughout: the repo is public, so they cost nothing, macOS included.
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5
        with:
          install_args: --locked

      - uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # The ktlint hook runs `mise run kt:fmt`, which rewrites files. prek fails any hook that
      # modifies the tree and --show-diff-on-failure prints what it changed, so a badly formatted
      # PR turns the job red with the fix in the log.
      - name: Run pre-commit checks
        run: mise run pre-commit

  # Fails when mise.lock or mise.ci.lock is out of date with mise.toml and mise.ci.toml: a tool
  # added or repinned without `mise lock`, or a platform missing from lockfile_platforms. A
  # --locked install only finds that out on the platform that lacks the entry, so this catches it
  # first. `mise lock` keeps the versions already pinned, so a new upstream release doesn't trip it.
  mise-lock:
    name: mise lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v5
        with:
          install: false
          cache: false

      # Resolving versions and checksums calls the GitHub API; the token avoids its anonymous
      # rate limit. With MISE_ENV=ci one refresh writes both lockfiles.
      - name: Check the lockfiles are current
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_LOCKED: "false"
        run: |
          set -euo pipefail
          mise lock
          if ! git diff --exit-code -- mise.lock mise.ci.lock; then
            echo "::error::mise.lock or mise.ci.lock is stale. Run \`mise run lock\` and commit the result."
            exit 1
          fi

  # core is pure Kotlin, so the JVM run covers its logic on Linux. The ./kotlin wrapper provisions
  # the toolchain and its JDK itself; only its download cache is kept between runs.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-test-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-test-

      - name: Test core on the JVM
        run: ./kotlin test -m core -p jvm

  # The hosted Ubuntu image has an Android SDK at $ANDROID_HOME, which the build uses.
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-android-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-android-

      - name: Build the Android app
        run: ./kotlin build -m android-app

  # Kotlin/Native needs a Mac to build Apple targets. Simulator builds aren't signed with the
  # team's certificate, so none is needed here.
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
          key: kotlin-${{ runner.os }}-ios-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-ios-

      - name: Test core on the iOS simulator
        run: ./kotlin test -m core -p iosSimulatorArm64

      - name: Build the iOS app for the simulator
        run: ./kotlin build -m ios-app -p iosSimulatorArm64
